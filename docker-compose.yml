version: '3.9'

services:
  backend:
    build: .
    container_name: enterprise-multi-agent-backend
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: staging
      API_HOST: 0.0.0.0
      API_PORT: 8001
      DATABASE_URL: sqlite:///./enterprise_multi_agent.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
